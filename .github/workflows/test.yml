name: Test and release
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: action_test
          POSTGRES_PASSWORD: action_test
          POSTGRES_DB: action_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U action_test -d action_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:postgres
        env:
          ACTION_LEDGER_TEST_DATABASE_URL: postgresql://action_test:action_test@127.0.0.1:5432/action_test
      - name: Test the companion demo against the packaged library
        run: |
          npm run gist
          npm pack --ignore-scripts
          demo_dir=$(mktemp -d)
          cp gist/*.js gist/package.json "$demo_dir/"
          npm install --prefix "$demo_dir" --ignore-scripts --no-audit --no-fund "$PWD/external-action-ledger-0.1.0.tgz"
          npm test --prefix "$demo_dir"
          npm start --prefix "$demo_dir"

  release:
    needs: test
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package the tested revision
        run: |
          npm run gist
          npm pack --ignore-scripts
          (cd gist && zip -q ../external-action-ledger-demo-0.1.0.zip README.md LICENSE package.json demo.js demo.test.js)
      - name: Publish the experimental GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 > /dev/null 2>&1; then
            echo 'Release v0.1.0 already exists; leaving it unchanged.'
            exit 0
          fi
          cp RELEASE_NOTES.md "$RUNNER_TEMP/release-notes.md"
          printf '\nValidated commit: %s\nWorkflow: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/release-notes.md"
          gh release create v0.1.0 external-action-ledger-0.1.0.tgz external-action-ledger-demo-0.1.0.zip \
            --target "$GITHUB_SHA" --title '0.1.0 (experimental)' --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md"
